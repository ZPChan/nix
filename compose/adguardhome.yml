services:
  adguardhome:
    image: docker.io/adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "8053:53/tcp"
      - "8053:53/udp"
      - "8080:80/tcp"
      - "3000:3000/tcp"
      - "8443:443/tcp"
      - "8443:443/udp"
    volumes:
      - adguardhome-work:/opt/adguardhome/work
      - adguardhome-conf:/opt/adguardhome/conf
volumes:
  adguardhome-work:
  adguardhome-conf:
