services:
  adguardhome:
    image: docker.io/adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "10053:53/tcp"
      - "10053:53/udp"
      - "10080:80/tcp"
      - "13000:3000/tcp"
      - "10443:443/tcp"
      - "10443:443/udp"
      - "10853:853/tcp"
    volumes:
      - adguardhome-work:/opt/adguardhome/work
      - adguardhome-conf:/opt/adguardhome/conf
volumes:
  adguardhome-work:
  adguardhome-conf:
